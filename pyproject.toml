[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polars-ta"
version = "0.1.0"
description = "Ultra-fast, zero-C technical analysis and alpha factor library powered natively by Polars."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Hữu Ân", email = "phanbuihuuan261103@gmail.com" }
]
keywords = [
    "polars",
    "technical-analysis",
    "trading",
    "quantitative-finance",
    "alpha-factors",
    "indicators",
    "algorithmic-trading",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "polars>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]
benchmark = [
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polars_ta"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=polars_ta --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
