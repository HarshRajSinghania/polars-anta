name: 🐛 Bug Report
description: Create a report to help us fix a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue in `polars-ta`!
  - type: textarea
    id: description
    attributes:
      label: Description of the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproducible Example
      description: Please provide a minimal, standalone Polars code snippet that reproduces the issue.
      render: python
      placeholder: |
        import polars as pl
        import polars_ta

        df = pl.DataFrame(...)
        # Code demonstrating the bug
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS, Python version, and Polars version (e.g. Windows 11, Python 3.12, polars 1.15.0)
    validations:
      required: true
